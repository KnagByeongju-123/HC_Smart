<title>HC_Smart 제작 사양 보드</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--line:#3d4358;--ink:#e8eaf0;--sub:#aab0c4;--gold:#e2b04a;--blue:#4f8cff;--grn:#3fc783;--red:#e06767}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:20px 14px 90px}
h1{font-size:18px;font-weight:900;letter-spacing:-.4px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.lg{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f6d365,#e2b04a);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#241a05;flex:none}
.sub{font-size:12px;color:var(--sub);margin-bottom:16px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
.tin{width:100%;background:#161925;border:1.5px solid var(--line);border-radius:9px;color:var(--ink);padding:10px 12px;font-size:13.5px;outline:none}
.tin:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(160deg,#f6d365,#e2b04a);color:#241a05;border:none;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn.g{background:var(--card);border:1.5px solid var(--line);color:var(--sub)}
.btn.b{background:var(--card);border:1.5px solid rgba(79,140,255,.55);color:#8ab2ff}
.item{display:flex;align-items:center;gap:10px;background:#161925;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:var(--gold)}
.item .t{font-weight:800;font-size:13.5px}
.item .s{font-size:11px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:22px 0}

/* ===== 사양 보드 ===== */
#board{display:none}
.bhead{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;border-bottom:1.5px solid var(--line);margin-bottom:14px}
.bhead .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bhead .co{font-size:16px;font-weight:900}
.bhead .est{margin-left:auto;font-size:13px;font-weight:800;color:var(--gold)}
.bhead .r2{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.legend{font-size:11px;color:var(--sub);margin-top:8px}
.legend b{font-weight:800}

.mod{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:13px 13px 11px;margin-bottom:13px}
.mod.off{opacity:.55}
.mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.mh .nm{flex:1;min-width:150px;background:transparent;border:none;border-bottom:1.5px dashed transparent;color:var(--ink);font-size:14.5px;font-weight:900;outline:none;padding:2px 0}
.mh .nm:focus{border-bottom-color:var(--gold)}
.mh .lv{font-size:10.5px;color:var(--sub);background:#161925;border:1px solid var(--line);border-radius:5px;padding:2px 7px;flex:none}
.mh .pr{width:104px;background:#161925;border:1.5px solid var(--line);border-radius:7px;color:var(--gold);font-weight:800;font-size:12.5px;padding:5px 8px;text-align:right;outline:none;flex:none}
.mh .pr:focus{border-color:var(--gold)}
.mh .del{flex:none;background:none;border:none;color:var(--sub);font-size:15px;cursor:pointer;padding:4px}
.mh .del:hover{color:var(--red)}

.it{display:flex;align-items:flex-start;gap:7px;padding:3px 0}
.it.child{margin-left:30px}
.st{flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:#161925;font-size:12.5px;font-weight:900;cursor:pointer;color:var(--sub);line-height:1}
.st.in{border-color:var(--grn);color:var(--grn)}
.st.ask{border-color:var(--gold);color:var(--gold)}
.st.out{border-color:var(--red);color:var(--red)}
.it .tx{flex:1;background:transparent;border:none;border-bottom:1.5px dashed transparent;color:var(--ink);font-size:13px;outline:none;padding:4px 2px;min-width:0}
.it .tx:focus{border-bottom-color:var(--gold)}
.it.stout .tx{color:var(--sub);text-decoration:line-through}
.iact{flex:none;display:flex;gap:2px}
.iact button{background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;padding:4px 5px;border-radius:5px}
.iact button:hover{background:#161925;color:var(--ink)}

.addrow.db .tin{padding:6px 10px;font-size:11.5px}
.addrow.db .btn{padding:6px 11px;font-size:12px}

      </div>
    </div>

      </div>
      <div class="r2">

    <div class="mod">

const SB_DEFAULT_URL='https://pllwltojbofjaftcemvn.supabase.co';
const SB_DEFAULT_KEY='sb_publishable_9dYJzdz472b888EcqdBBaA_Ncwk0yvT';
const getSbUrl=()=>(localStorage.getItem(LS_SBURL)||SB_DEFAULT_URL).replace(/\/+$/,'');
const getSbKey=()=>localStorage.getItem(LS_SBKEY)||SB_DEFAULT_KEY;
async function sb(path,opt){
  const o=opt||{};
  const r=await fetch(getSbUrl()+'/rest/v1/'+path,{
    method:o.method||'GET',
    headers:Object.assign({'apikey':getSbKey(),'Authorization':'Bearer '+getSbKey(),'Content-Type':'application/json','Prefer':'return=representation'},o.headers||{}),
    body:o.body?JSON.stringify(o.body):undefined
  });
  if(!r.ok) throw new Error('DB '+r.status+': '+(await r.text()).slice(0,120));
  const t=await r.text();
  return t?JSON.parse(t):null;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400);}

create policy "hk_specs_all" on hk_specs for all using (true) with check (true);`;

    x:[ 'attend — 출퇴근 기록 (사원·일자·출근/퇴근시각·구분)',
        'leave — 휴가 신청/승인 (포함 여부 협의)' ] },
  '작업자 배치 · 교육이력': {
    m:[ 'worker — 작업자 마스터 (부서·직무·입사일)' ],
    x:[ 'assign — 공정별 배치 이력 (작업자·공정·시작/종료)',
        'edu_log — 교육·자격 이력 (작업자·과정/자격·취득일·만료일)' ] },
  '단가 · 외주비 정산': {
    m:[ 'price — 단가 마스터 (품번·공정·단가·적용시작/종료)' ],
    x:[ 'settle — 월별 정산 (업체·월·실적수량·금액·확정여부)',
        'price_log — 단가 변경 이력 (품번·이전/이후 단가·변경일·변경자)' ] },
  '매출 · 매입 집계': {
    m:[ 'vendor — 거래처 마스터 (공용)' ],
    x:[ 'sales — 매출 등록 (일자·거래처·품목·금액) ※ 출하 연계 여부 협의',
        'purchase — 매입 등록 (일자·거래처·품목·금액) ※ 발주 연계 여부 협의' ] },
  '회비 · 모임 정산': {
    m:[ 'member — 회원 명부 (이름·연락처·상태) ※ 호영회 참조',
        'fee_rule — 회비 기준 (연회비·월회비·회계연도)' ],
    x:[ 'fee_pay — 납부 (회원·회차·금액·납부일)',
        'event_settle — 모임 지출·정산 (행사·항목·금액·영수증)' ] },
  '일정 · 예약 · 알림 발송': {
    m:[],
    x:[ 'schedule — 일정/예약 (일자·시간·일정명·대상·알림설정·응답)' ] }
};

/* ===== 세팅 목록 ===== */
let LIST=[];
async function loadList(){
  const box=document.getElementById('list');
  box.innerHTML='<div class="empty">불러오는 중...</div>';
  try{
    const rows=await sb('hk_setups?select=*&order=created_at.desc&limit=30');
    LIST=(rows||[]).map(r=>({company:r.company,name:r.name,tel:r.tel,sc:r.sc||[],scEtc:r.sc_etc||'',memo:r.memo||'',at:r.created_at}));
  }catch(e){
    try{ LIST=(JSON.parse(localStorage.getItem(LS_SETUPS))||[]); }catch(_){ LIST=[]; }
    toast('서버 조회 실패 — 이 기기의 저장분을 표시합니다');
  }
  if(!LIST.length){ box.innerHTML='<div class="empty">저장된 맞춤세팅이 없습니다.<br>index.html의 맞춤세팅에서 먼저 저장·발송하세요.</div>'; return; }
  box.innerHTML=LIST.map((d,i)=>'<div class="item" onclick="openSpec('+i+')">'
    +'<div><div class="t">'+(esc(d.company)||'(업체명 미입력)')+'</div>'
    +'<div class="s">'+new Date(d.at).toLocaleDateString('ko-KR')+' · 모듈 '+((d.sc||[]).length)+'개'+(d.scEtc?'+기타':'')+'</div></div>'
    +'<button class="btn" style="margin-left:auto;flex:none;padding:8px 13px;font-size:12px" onclick="event.stopPropagation();openSpec('+i+')">사양 편집</button></div>').join('');
}

/* ===== 사양 데이터 ===== */
let SPEC=null;   /* { company, base:{...}, mods:[{name,lv,price,items:[{t,st,ch:[{t,st}]}]}], memo } */
const seedItems=a=>(a||[]).map(t=>({t,st:t.indexOf('협의')>=0?'ask':'in',ch:[]}));
const seedDb=src=>({ m:seedItems((src||{}).m), x:seedItems((src||{}).x) });
function seedSpec(d){
  return {
    company:d.company||'',
    base:{name:BASE_PLATFORM.name,lv:'공통',price:BASE_PLATFORM.p,items:seedItems(BASE_SPEC),db:seedDb(BASE_DB)},
    mods:(d.sc||[]).map(k=>{
      const m=MODULE_PRICE[k]||{p:0,lv:'협의'};
      return {name:k,lv:m.lv,price:m.p,items:seedItems(MODULE_SPEC[k]||['세부 기능 범위 회의에서 정의']),db:seedDb(MODULE_DB[k])};
    }).concat(d.scEtc?[{name:d.scEtc,lv:'협의',price:0,items:seedItems(['요구사항 청취 · 범위 정의 (협의)']),db:seedDb(null)}]:[]),
    memo:d.memo||''
  };
}
/* 이전에 저장된 사양(DB 필드 없음)을 열 때 모듈명 기준으로 DB 정의 보충 */
function ensureDb(sp){
  if(!sp) return;
  if(!sp.base.db) sp.base.db=seedDb(BASE_DB);
  (sp.mods||[]).forEach(m=>{ if(!m.db) m.db=seedDb(MODULE_DB[m.name]); });
}
async function openSpec(i){
  const d=LIST[i]; if(!d) return;
  if(!d.company){ toast('업체명이 없는 세팅은 사양을 저장할 수 없습니다'); return; }
  SPEC=null;
  try{
    const r=await sb('hk_specs?company=eq.'+encodeURIComponent(d.company)+'&select=data&limit=1');
    if(r&&r.length&&r[0].data&&r[0].data.mods){ SPEC=r[0].data; toast('저장된 사양을 불러왔습니다'); }
  }catch(e){}
  if(!SPEC){
    try{
      const loc=JSON.parse(localStorage.getItem(LS_SPECS))||{};
      if(loc[d.company]) { SPEC=loc[d.company]; toast('이 기기의 저장 사양을 불러왔습니다'); }
    }catch(e){}
  }
  if(!SPEC) SPEC=seedSpec(d);
  ensureDb(SPEC);
  SPEC.company=d.company;
  document.getElementById('list-box').style.display='none';
  document.getElementById('board').style.display='block';
  document.getElementById('b-co').textContent=SPEC.company;
  document.getElementById('memo').value=SPEC.memo||'';
  render();
  window.scrollTo(0,0);
}
function backToList(){
  document.getElementById('board').style.display='none';
  document.getElementById('list-box').style.display='block';
}

/* ===== 렌더 ===== */
const allCards=()=>[SPEC.base].concat(SPEC.mods);
function estTotal(){ return allCards().reduce((a,m)=>a+(+m.price||0),0); }
function stSym(s){ return s==='in'?'✓':s==='ask'?'?':'✕'; }
function itRow(mi,ii,ci,it){
  const path=mi+','+ii+','+ci;
  return '<div class="it'+(ci>=0?' child':'')+(it.st==='out'?' stout':'')+'">'
    +'<button class="st '+it.st+'" onclick="cyc('+path+')" title="포함/협의/제외">'+stSym(it.st)+'</button>'
    +'<input class="tx" value="'+esc(it.t)+'" oninput="ed('+path+',this.value)">'
    +'<span class="iact">'
    +(ci<0?'<button onclick="addCh('+mi+','+ii+')" title="하위 가지 추가">⌵</button>':'')
    +'<button onclick="delIt('+path+')" title="삭제">✕</button></span></div>';
}
function render(){
  document.getElementById('mods').innerHTML=allCards().map((m,x)=>{
    const mi=x-1; /* base = -1 */
    return '<div class="mod">'
      +'<div class="mh">'
      +'<input class="nm" value="'+esc(m.name)+'" oninput="mEd('+mi+',\'name\',this.value)"'+(mi<0?' readonly':'')+'>'
      +'<span class="lv">난이도 '+esc(m.lv||'-')+'</span>'
      +'<input class="pr" inputmode="numeric" value="'+(+m.price||0).toLocaleString('ko-KR')+'" oninput="mPrice('+mi+',this)"> '
      +(mi>=0?'<button class="del" onclick="delMod('+mi+')" title="카드 삭제">🗑</button>':'')
      +'</div>'
      +m.items.map((it,ii)=>itRow(mi,ii,-1,it)+(it.ch||[]).map((c,ci)=>itRow(mi,ii,ci,c)).join('')).join('')
      +'<div class="addrow"><input class="tin" id="ai-'+mi+'" placeholder="세부항목 추가" onkeydown="if(event.key===\'Enter\')addIt('+mi+')"><button class="btn g" onclick="addIt('+mi+')">＋ 추가</button></div>'
      +dbSection(mi,m)
      +'</div>';
  }).join('');
  document.getElementById('b-est').textContent='기준가 합계 '+won(estTotal())+' (VAT 별도)';
}
const card=mi=>mi<0?SPEC.base:SPEC.mods[mi];
const node=(mi,ii,ci)=>ci<0?card(mi).items[ii]:card(mi).items[ii].ch[ci];

/* ===== DB 섹션 (m=마스터 · x=일반) ===== */
function dbRow(mi,g,di,it){
  return '<div class="it dbit'+(it.st==='out'?' stout':'')+'">'
    +'<button class="st '+it.st+'" onclick="cycDb('+mi+',\''+g+'\','+di+')" title="포함/협의/제외">'+stSym(it.st)+'</button>'
    +'<input class="tx" value="'+esc(it.t)+'" oninput="edDb('+mi+',\''+g+'\','+di+',this.value)">'
    +'<span class="iact"><button onclick="delDb('+mi+',\''+g+'\','+di+')" title="삭제">✕</button></span></div>';
}
function dbSection(mi,m){
  const db=m.db||{m:[],x:[]};
  return '<div class="dbh">🗂 마스터 DB (기준정보)</div>'
    +(db.m.length?db.m.map((it,di)=>dbRow(mi,'m',di,it)).join(''):'<div class="dbnone">공통 마스터 사용 (별도 테이블 없음)</div>')
    +'<div class="addrow db"><input class="tin" id="db-'+mi+'-m" placeholder="마스터 테이블 추가 (예: item — 품번·품명·규격)" onkeydown="if(event.key===\'Enter\')addDb('+mi+',\'m\')"><button class="btn g" onclick="addDb('+mi+',\'m\')">＋</button></div>'
    +'<div class="dbh">📄 일반 DB (트랜잭션)</div>'
    +(db.x.length?db.x.map((it,di)=>dbRow(mi,'x',di,it)).join(''):'<div class="dbnone">등록된 테이블 없음</div>')
    +'<div class="addrow db"><input class="tin" id="db-'+mi+'-x" placeholder="일반 테이블 추가 (예: work_report — 일자·작업자·수량)" onkeydown="if(event.key===\'Enter\')addDb('+mi+',\'x\')"><button class="btn g" onclick="addDb('+mi+',\'x\')">＋</button></div>';
}
const dbList=(mi,g)=>{ const c=card(mi); if(!c.db) c.db={m:[],x:[]}; return c.db[g]; };
function cycDb(mi,g,di){ const n=dbList(mi,g)[di]; n.st=n.st==='in'?'ask':n.st==='ask'?'out':'in'; render(); }
function edDb(mi,g,di,v){ dbList(mi,g)[di].t=v; }
function delDb(mi,g,di){ dbList(mi,g).splice(di,1); render(); }
function addDb(mi,g){
  const el=document.getElementById('db-'+mi+'-'+g);
  const t=el.value.trim(); if(!t){ el.focus(); return; }
  dbList(mi,g).push({t,st:'in',ch:[]});
  render();
  const ne=document.getElementById('db-'+mi+'-'+g); if(ne) ne.focus();
}

/* ===== 편집 ===== */
function ed(mi,ii,ci,v){ node(mi,ii,ci).t=v; }
function cyc(mi,ii,ci){
  const n=node(mi,ii,ci);
  n.st=n.st==='in'?'ask':n.st==='ask'?'out':'in';
  render();
}
function delIt(mi,ii,ci){
  if(ci<0) card(mi).items.splice(ii,1);
  else card(mi).items[ii].ch.splice(ci,1);
  render();
}
function addIt(mi){
  const el=document.getElementById('ai-'+mi);
  const t=el.value.trim(); if(!t){ el.focus(); return; }
  card(mi).items.push({t,st:'in',ch:[]});
  render();
  const ne=document.getElementById('ai-'+mi); if(ne){ ne.focus(); }
}
function addCh(mi,ii){
  const t=prompt('하위 가지 항목 입력'); if(!t||!t.trim()) return;
  const it=card(mi).items[ii];
  it.ch=it.ch||[];
  it.ch.push({t:t.trim(),st:'in'});
  render();
}
function mEd(mi,k,v){ card(mi)[k]=v; }
function mPrice(mi,el){
  const d=el.value.replace(/[^\d]/g,'');
  card(mi).price=+d||0;
  el.value=(+d||0).toLocaleString('ko-KR');
  document.getElementById('b-est').textContent='기준가 합계 '+won(estTotal())+' (VAT 별도)';
}
function delMod(mi){
  if(!confirm('"'+SPEC.mods[mi].name+'" 카드를 삭제할까요?')) return;
  SPEC.mods.splice(mi,1);
  render();
}
function addMod(){
  const t=prompt('추가할 모듈(기능) 이름'); if(!t||!t.trim()) return;
  SPEC.mods.push({name:t.trim(),lv:'협의',price:0,items:[]});
  render();
  window.scrollTo(0,document.body.scrollHeight);
}

/* ===== 저장 (Supabase upsert + 로컬 폴백) ===== */
async function saveSpec(){
  if(!SPEC) return;
  SPEC.memo=document.getElementById('memo').value;
  /* 로컬 */
  try{
    const loc=JSON.parse(localStorage.getItem(LS_SPECS))||{};
    loc[SPEC.company]=SPEC;
    localStorage.setItem(LS_SPECS,JSON.stringify(loc));
  }catch(e){}
  /* 서버 */
  try{
    const ex=await sb('hk_specs?company=eq.'+encodeURIComponent(SPEC.company)+'&select=id&limit=1');
    const row={company:SPEC.company,data:SPEC,updated_at:new Date().toISOString()};
    if(ex&&ex.length) await sb('hk_specs?id=eq.'+ex[0].id,{method:'PATCH',body:row});
    else await sb('hk_specs',{method:'POST',body:row});
    toast('저장 완료 — 견적서 생성 시 이 사양이 자동 반영됩니다');
  }catch(e){
    toast('서버 저장 실패('+e.message.slice(0,40)+') — 이 기기에는 저장됨. 테이블 SQL 실행 여부를 확인하세요');
  }
}

/* ===== 개발 지시문 ===== */
function buildPrompt(){
  const L=['[HC_Smart 제작 사양 — '+SPEC.company+']',''];
  L.push('아래 사양대로 단일 index.html(모바일 우선, Supabase REST 직접 fetch, GitHub Pages 배포)을 구현한다.');
  L.push('상태 표기: (협의) = 범위 미확정, 구현 전 확인 필요. 표기 없는 항목은 확정 사양.');
  L.push('[DB] 표기는 모듈별 필요 테이블(마스터=기준정보 · 일반=트랜잭션)과 주요 컬럼 정의다. 테이블명 접두어는 프로젝트 코드로 통일하고, 생성 SQL(RLS 정책 포함)을 별도 제시한다.');
  allCards().forEach((m,x)=>{
    const items=m.items.filter(it=>it.st!=='out');
    if(x>0 && !items.length) return;
    L.push('');
    L.push('■ '+m.name+' [난이도 '+(m.lv||'-')+' · 기준가 '+won(+m.price||0)+']');
    items.forEach(it=>{
      L.push('- '+it.t+(it.st==='ask'?' (협의)':''));
      (it.ch||[]).filter(c=>c.st!=='out').forEach(c=>L.push('  · '+c.t+(c.st==='ask'?' (협의)':'')));
    });
    const db=m.db||{m:[],x:[]};
    const dm=(db.m||[]).filter(t=>t.st!=='out'), dx=(db.x||[]).filter(t=>t.st!=='out');
    if(dm.length||dx.length){
      L.push('  [DB]');
      dm.forEach(t=>L.push('  · 마스터: '+t.t+(t.st==='ask'?' (협의)':'')));
      dx.forEach(t=>L.push('  · 일반: '+t.t+(t.st==='ask'?' (협의)':'')));
    }
  });
  if(SPEC.memo&&SPEC.memo.trim()){ L.push(''); L.push('■ 회의 메모 · 추가 요청'); L.push(SPEC.memo.trim()); }
  L.push('');
  L.push('합계(기준가): '+won(estTotal())+' (VAT 별도)');
  L.push('작성일시: '+new Date().toLocaleString('ko-KR'));
  return L.join('\n');
}
function copyPrompt(){
  SPEC.memo=document.getElementById('memo').value;
  navigator.clipboard.writeText(buildPrompt()).then(()=>toast('개발 지시문이 복사되었습니다'),()=>toast('복사 실패'));
}

loadList();
</script>

</html>
