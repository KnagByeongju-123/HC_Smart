<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HC_Smart 제작 사양서</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--line:#3d4358;--ink:#e8eaf0;--sub:#aab0c4;--gold:#e2b04a;--blue:#4f8cff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:19px;font-weight:900;letter-spacing:-.4px}
.top{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.lg{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f6d365,#e2b04a);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#241a05}
.sub{font-size:12px;color:var(--sub);margin-bottom:18px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.tin{width:100%;background:#161925;border:1.5px solid var(--line);border-radius:9px;color:var(--ink);padding:11px 13px;font-size:14px;outline:none}
.tin:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(160deg,#f6d365,#e2b04a);color:#241a05;border:none;border-radius:9px;padding:11px 18px;font-size:13.5px;font-weight:800;cursor:pointer}
.btn.g{background:var(--card);border:1.5px solid var(--line);color:var(--sub)}
.item{display:flex;align-items:center;gap:10px;background:#161925;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:var(--gold)}
.item .t{font-weight:800;font-size:14px}
.item .s{font-size:11.5px;color:var(--sub)}
.item .go{margin-left:auto;flex:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:24px 0}

/* ===== 사양서 문서 (화면·인쇄 공용) ===== */
#doc{display:none;background:#fff;color:#1a1a1a;border-radius:12px;padding:26px 28px;font-size:12.5px}
#doc .hd{display:flex;align-items:center;gap:12px;border-bottom:3px solid #b8860b;padding-bottom:12px;margin-bottom:14px}
#doc .hd .lg2{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#f6d365,#e2b04a);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#241a05}
#doc h2{font-size:19px;font-weight:900;letter-spacing:-.5px}
#doc .hs{font-size:10.5px;color:#777}
#doc table.ov{width:100%;border-collapse:collapse;margin-bottom:16px}
#doc table.ov th,#doc table.ov td{border:1px solid #d8d2c4;padding:6px 9px;font-size:12px;text-align:left}
#doc table.ov th{background:#faf5e8;width:110px;font-weight:800;color:#8a6510}
#doc .mod{border:1px solid #ddd;border-radius:8px;padding:11px 13px;margin-bottom:11px;page-break-inside:avoid}
#doc .mh{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:4px;flex-wrap:wrap}
#doc .mn{min-width:34px;text-align:center;background:#8a6510;color:#fff;border-radius:5px;font-size:11px;font-weight:800;padding:2px 6px}
#doc .mm{margin-left:auto;font-size:11px;color:#8a6510;font-weight:700}
#doc .ms{font-size:11.5px;color:#666;margin-bottom:7px}
#doc .ck{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px}
#doc .ci{display:flex;align-items:flex-start;gap:7px;padding:2px 0}
#doc .bx{flex:none;width:11px;height:11px;border:1.5px solid #8a6510;border-radius:2.5px;margin-top:4px}
#doc .memo{margin-top:8px;padding-top:6px;border-top:1px dashed #ccc;font-size:11px;color:#999;min-height:26px}
#doc .tot{margin:14px 0;padding:10px 14px;background:#faf5e8;border:1px solid #e2d3a8;border-radius:8px;font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
#doc .rq{border:1px solid #ddd;border-radius:8px;padding:11px 13px;margin-bottom:11px;font-size:12px}
#doc .rq b{color:#8a6510}
#doc .ft{margin-top:22px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#999;text-align:center}
@media (max-width:600px){ #doc .ck{grid-template-columns:1fr} }

@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  #doc{display:block!important;border-radius:0;padding:0;border:none}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top noprint"><div class="lg">HC</div><h1>제작 사양서 <span style="font-size:12px;font-weight:400;color:var(--sub)">제작회의용 · 관리자 전용</span></h1></div>
  <div class="sub noprint">저장된 맞춤세팅을 선택하면 항목별 세부기능 체크리스트 문서가 생성됩니다.</div>

  <!-- PIN -->
  <div class="card noprint" id="pin-box">
    <div style="font-size:13px;font-weight:800;margin-bottom:9px">🔒 관리자 PIN</div>
    <div style="display:flex;gap:8px">
      <input class="tin" id="pin" type="password" inputmode="numeric" placeholder="관리자 PIN 입력" onkeydown="if(event.key==='Enter')auth()">
      <button class="btn" style="flex:none" onclick="auth()">확인</button>
    </div>
  </div>

  <!-- 세팅 선택 -->
  <div class="card noprint" id="list-box" style="display:none">
    <div style="display:flex;align-items:center;margin-bottom:10px">
      <div style="font-size:13px;font-weight:800">📋 사양서를 만들 맞춤세팅 선택</div>
      <button class="btn g" style="margin-left:auto;padding:7px 12px;font-size:12px" onclick="loadList()">새로고침</button>
    </div>
    <div id="list"><div class="empty">불러오는 중...</div></div>
  </div>

  <!-- 문서 액션 -->
  <div class="noprint" id="doc-act" style="display:none;margin-bottom:10px;display:none;gap:8px">
    <button class="btn" onclick="window.print()">🖨 인쇄 · PDF 저장</button>
    <button class="btn g" onclick="backToList()">← 목록으로</button>
  </div>

  <!-- 사양서 본문 -->
  <div id="doc"></div>

</div>
<div class="toast" id="toast"></div>

/* ===== 인증 ===== */
function auth(){
  if(document.getElementById('pin').value===getPin()){
    document.getElementById('pin-box').style.display='none';
    document.getElementById('list-box').style.display='block';
    loadList();
  } else toast('PIN이 올바르지 않습니다');
}

/* ===== 세팅 목록 (서버 → 실패 시 이 기기 저장분) ===== */
let LIST=[];
async function loadList(){
  const box=document.getElementById('list');
  box.innerHTML='<div class="empty">불러오는 중...</div>';
  try{
    const rows=await sb('hk_setups?select=*&order=created_at.desc&limit=30');
    LIST=(rows||[]).map(r=>({
      company:r.company,name:r.name,tel:r.tel,
      ind:r.ind?r.ind.split(',').map(x=>x.trim()).filter(Boolean):[],
      design:r.design||null,sc:r.sc||[],scEtc:r.sc_etc||'',
      domain:r.domain||'무료 기본주소 사용',domainName:r.domain_name||'',
      memo:r.memo||'',at:r.created_at
    }));
  }catch(e){
    try{ LIST=JSON.parse(localStorage.getItem(LS_SETUPS))||[]; }catch(_){ LIST=[]; }
    toast('서버 조회 실패 — 이 기기의 저장분을 표시합니다');
  }
  if(!LIST.length){ box.innerHTML='<div class="empty">저장된 맞춤세팅이 없습니다.<br>index.html의 맞춤세팅에서 먼저 저장·발송하세요.</div>'; return; }
  box.innerHTML=LIST.map((d,i)=>{
    const p=parseDesign(d.design);
    return '<div class="item" onclick="render('+i+')">'
      +'<div><div class="t">'+(esc(d.company)||'(업체명 미입력)')+'</div>'
      +'<div class="s">'+new Date(d.at).toLocaleDateString('ko-KR')+' · '+p.T+'+'+p.L+'+'+p.M+' · 모듈 '+((d.sc||[]).length)+'개</div></div>'
      +'<button class="btn go" style="padding:8px 14px;font-size:12px" onclick="event.stopPropagation();render('+i+')">사양서 생성</button></div>';
  }).join('');
}

/* ===== 사양서 렌더 ===== */
function sec(no,name,meta,summary,items){
  return '<div class="mod"><div class="mh"><span class="mn">'+no+'</span><b>'+esc(name)+'</b>'+(meta?'<span class="mm">'+esc(meta)+'</span>':'')+'</div>'
    +(summary?'<div class="ms">'+esc(summary)+'</div>':'')
    +'<div class="ck">'+items.map(it=>'<div class="ci"><span class="bx"></span>'+esc(it)+'</div>').join('')+'</div>'
    +'<div class="memo">결정사항 · 비고 :</div></div>';
}
function render(i){
  const d=LIST[i]; if(!d) return;
  const p=parseDesign(d.design);
  const dsn=p.T+' '+(TH[p.T]||'')+' / '+p.L+' '+(LK[p.L]||'')+' / '+p.M+' '+(MN[p.M]||'');
  const sc=d.sc||[];
  let total=BASE_PLATFORM.p, no=0;
  let body=sec('공통',BASE_PLATFORM.name,'기준가 '+won(BASE_PLATFORM.p),BASE_PLATFORM.d,BASE_SPEC);
  sc.forEach(k=>{
    no++;
    const m=MODULE_PRICE[k];
    const items=MODULE_SPEC[k]||['세부 기능 범위 회의에서 정의'];
    if(m){ total+=m.p; body+=sec(no,k,'난이도 '+m.lv+' · 기준가 '+won(m.p),m.d,items); }
    else  body+=sec(no,k,'협의 산정','',items);
  });
  if(d.scEtc){
    no++;
    body+=sec(no,d.scEtc,'별도 협의','고객 직접 입력 항목 — 범위 확정 후 산정',
      ['요구사항 청취 · 범위 정의','난이도·기준가 산정','일정 반영 여부 결정']);
  }
  document.getElementById('doc').innerHTML=
    '<div class="hd"><div class="lg2">HC</div><div><h2>HC_Smart 제작 사양서</h2><div class="hs">Production Specification · 제작회의용 — 항목별 세부기능 체크리스트</div></div></div>'
    +'<table class="ov">'
    +'<tr><th>업체명</th><td>'+(esc(d.company)||'(미입력)')+'</td><th>담당자</th><td>'+(esc(d.name)||'-')+(d.tel?' / '+esc(d.tel):'')+'</td></tr>'
    +'<tr><th>업종</th><td>'+(esc((d.ind||[]).join(', '))||'-')+'</td><th>디자인</th><td>'+esc(dsn)+'</td></tr>'
    +'<tr><th>도메인</th><td>'+esc(d.domain||'무료 기본주소 사용')+(d.domainName?' : '+esc(d.domainName):'')+'</td><th>작성일</th><td>'+new Date().toLocaleDateString('ko-KR')+'</td></tr>'
    +'</table>'
    +body
    +(d.memo?'<div class="rq"><b>■ 고객 추가 요청사항</b><br>'+esc(d.memo).replace(/\n/g,'<br>')+'</div>':'')
    +'<div class="tot"><span>선택 모듈 '+sc.length+'개 + 기본 플랫폼 · 기준가 합계 (VAT 별도)</span><span>'+won(total)+'</span></div>'
    +'<div class="ft">HC_Smart · 세부항목의 □ 체크는 제작 범위 확정용이며, \'협의\' 표기 항목은 회의에서 포함 여부를 결정합니다</div>';
  document.getElementById('doc').style.display='block';
  document.getElementById('list-box').style.display='none';
  document.getElementById('doc-act').style.display='flex';
  window.scrollTo(0,0);
}
function backToList(){
  document.getElementById('doc').style.display='none';
  document.getElementById('doc-act').style.display='none';
  document.getElementById('list-box').style.display='block';
}
