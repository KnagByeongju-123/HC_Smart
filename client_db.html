<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>업체DB — HC_Smart</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0f1117; --card:#1a1d27; --card2:#161925; --line:#3a4152; --line2:#2a3040;
  --ink:#e8eaf0; --sub:#aab0c4; --gold:#e2b04a; --gold2:#f6d365; --gold3:#fda085;
  --goldbg:rgba(226,176,74,.12); --goldbd:rgba(226,176,74,.4);
  --blue:#4f8cff; --green:#7ee0a0; --red:#ff7b7b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
.gold-txt{background:linear-gradient(120deg,var(--gold2),var(--gold),var(--gold3),var(--gold2));
  background-size:250% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:250% center}}

header{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,#181b26,#0f1117ee);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:11px 16px}
.hback{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);font-size:17px;font-weight:900;flex-shrink:0}
header .ht{font-size:17px;font-weight:900;letter-spacing:-.3px}
header .hb{margin-left:auto;font-size:11px;font-weight:800;color:var(--gold);
  border:1px solid var(--goldbd);background:var(--goldbg);padding:3px 12px;border-radius:14px;cursor:pointer}

main{max-width:880px;margin:0 auto;padding:78px 16px 60px}

/* 금고 잠금 화면 */
#vault{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
#vault::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,rgba(226,176,74,.16),transparent 55%)}
#vault.off{display:none}
#vault .vlogo{width:64px;height:64px;border-radius:50%;position:relative;z-index:1;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a05;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;
  box-shadow:0 0 30px rgba(226,176,74,.35)}
#vault h2{position:relative;z-index:1;font-size:22px;font-weight:900}
#vault .vs{position:relative;z-index:1;font-size:12.5px;color:var(--sub);text-align:center;max-width:340px;line-height:1.7}
#vault .vbox{position:relative;z-index:1;width:100%;max-width:330px;display:flex;flex-direction:column;gap:9px;margin-top:6px}
#vault input{width:100%;padding:14px;border-radius:12px;background:var(--card2);border:1.5px solid #4a5268;
  color:var(--ink);font-size:16px;font-family:inherit;text-align:center;outline:none}
#vault input:focus{border-color:var(--gold)}
#vault button{padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;
  background:linear-gradient(160deg,var(--gold2),var(--gold));color:#241a05}
#vault .vwarn{position:relative;z-index:1;font-size:11.5px;color:var(--red);min-height:16px}
#vault .vnote{position:relative;z-index:1;font-size:11px;color:var(--sub);opacity:.75;max-width:340px;text-align:center;
  border:1px solid var(--line);border-radius:11px;padding:10px 14px;line-height:1.7;margin-top:6px}
#vault.shake .vbox{animation:shk .4s}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar input.sch{flex:1;min-width:180px;padding:10px 13px;border:1.5px solid #4a5268;border-radius:10px;
  background:var(--card2);color:var(--ink);font-size:14px;font-family:inherit;outline:none}
.bar input.sch:focus{border-color:var(--gold)}
.btn{padding:10px 18px;border:none;border-radius:10px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-p{background:linear-gradient(160deg,var(--gold2),var(--gold));color:#241a05}
.btn-s{background:var(--card);border:1px solid var(--line);color:var(--sub)}
.btn-d{background:rgba(255,123,123,.14);border:1px solid rgba(255,123,123,.4);color:var(--red)}
.btn-g{background:rgba(126,224,160,.16);border:1px solid rgba(126,224,160,.4);color:var(--green)}

.cc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:9px;cursor:pointer;transition:border-color .15s}
.cc:hover{border-color:var(--goldbd)}
.cc .t{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cc .nm{font-size:15.5px;font-weight:800}
.cc .tg{font-size:10.5px;font-weight:800;color:var(--gold);background:var(--goldbg);border:1px solid var(--goldbd);padding:1px 8px;border-radius:12px}
.cc .tg.b{color:var(--blue);background:rgba(79,140,255,.12);border-color:rgba(79,140,255,.4)}
.cc .tg.g{color:var(--green);background:rgba(126,224,160,.12);border-color:rgba(126,224,160,.4)}
.cc .d{font-size:12.3px;color:var(--sub);margin-top:4px}
.empty{text-align:center;color:var(--sub);padding:48px 0;font-size:13.5px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-bottom:14px}
.panel h3{font-size:14px;font-weight:900;color:var(--gold);letter-spacing:.5px;margin-bottom:14px;
  display:flex;align-items:center;gap:8px}
.panel h3::after{content:'';flex:1;height:1px;background:var(--line)}
.fg{margin-bottom:11px}
.fg label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:4px}
.fg input,.fg textarea,.fg select{width:100%;padding:10px 12px;border:1.5px solid #4a5268;border-radius:10px;
  font-size:14px;font-family:inherit;background:var(--card2);color:var(--ink);outline:none}
.fg input:focus,.fg textarea:focus{border-color:var(--gold)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
@media(max-width:640px){.r2,.r3{grid-template-columns:1fr}}

.sec-in{position:relative}
.sec-in input{padding-right:88px;font-family:'Consolas','Menlo',monospace}
.sec-in .tools{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.sec-in .tools button{border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:7px;font-size:11px;font-weight:700;padding:5px 8px;cursor:pointer;font-family:inherit}
.sec-in .tools button:hover{color:var(--gold);border-color:var(--goldbd)}

.ctc{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;position:relative}
.ctc .del{position:absolute;top:9px;right:10px;background:none;border:none;color:#5a6478;font-size:15px;cursor:pointer}
.ctc .del:hover{color:var(--red)}

.lockbadge{font-size:10.5px;font-weight:800;color:var(--green);background:rgba(126,224,160,.12);
  border:1px solid rgba(126,224,160,.4);padding:2px 9px;border-radius:11px;margin-left:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#252a3a;
  border:1px solid var(--goldbd);color:var(--ink);padding:11px 22px;border-radius:11px;font-size:13px;
  font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.toast.show{opacity:1}
.warnbox{background:rgba(255,123,123,.08);border:1px solid rgba(255,123,123,.35);border-radius:12px;
  padding:12px 15px;font-size:12px;color:#ffb0b0;line-height:1.7;margin-bottom:14px}
.hide{display:none!important}
</style>
</head>
<body>

<!-- ===== 금고 잠금 화면 ===== -->
<div id="vault">
  <div class="vlogo">🔐</div>
  <h2>업체DB 금고</h2>
  <div class="vs">계정정보는 이 브라우저에서 암호화되어 저장됩니다.<br>마스터 비밀번호는 서버에 전송되지 않습니다.</div>
  <div class="vbox">
    <input type="password" id="mpw" placeholder="마스터 비밀번호" autocomplete="off">
    <button onclick="unlock()">잠금 해제</button>
  </div>
  <div class="vwarn" id="vwarn"></div>
  <div class="vnote" id="vnote">비밀번호를 분실하면 저장된 계정정보는 복구할 수 없습니다.<br>반드시 별도로 보관하세요.</div>
</div>

<header>
  <div class="hback" onclick="location.href='index.html'">‹</div>
  <div class="ht gold-txt">업체DB</div>
  <div class="hb" onclick="relock()">🔒 잠그기</div>
</header>

<main>
  <!-- 목록 -->
  <div id="v-list">
    <div class="bar">
      <input class="sch" id="sch" placeholder="회사명 · 담당자 · 프로젝트 검색" oninput="renderList()">
      <button class="btn btn-p" onclick="newClient()">＋ 신규</button>
      <button class="btn btn-s" onclick="exportBackup()">백업</button>
    </div>
    <div id="list"></div>
  </div>

  <!-- 편집 -->
  <div id="v-edit" class="hide">
    <div class="bar">
      <button class="btn btn-s" onclick="backList()">‹ 목록</button>
      <button class="btn btn-p" onclick="saveClient()">저장</button>
      <button class="btn btn-d" id="delbtn" onclick="delClient()">삭제</button>
      <span class="lockbadge">🔐 계정정보 암호화 저장</span>
    </div>

    <div class="panel">
      <h3>회사 정보</h3>
      <div class="r2">
        <div class="fg"><label>회사명 *</label><input id="f-company"></div>
        <div class="fg"><label>사업자등록번호</label><input id="f-bizno" placeholder="000-00-00000"></div>
      </div>
      <div class="fg"><label>주소</label><input id="f-addr"></div>
      <div class="r3">
        <div class="fg"><label>대표전화</label><input id="f-tel"></div>
        <div class="fg"><label>대표메일</label><input id="f-email"></div>
        <div class="fg"><label>업종</label><input id="f-industry"></div>
      </div>
      <div class="fg"><label>홈페이지</label><input id="f-homepage" placeholder="https://"></div>
    </div>

    <div class="panel">
      <h3>담당자</h3>
      <div id="ctcs"></div>
      <button class="btn btn-s" onclick="addContact()">＋ 담당자 추가</button>
    </div>

    <div class="panel">
      <h3>Supabase 프로젝트</h3>
      <div class="r2">
        <div class="fg"><label>Organization</label><input id="f-sborg"></div>
        <div class="fg"><label>Project 명</label><input id="f-sbproject"></div>
      </div>
      <div class="fg"><label>Project URL</label><input id="f-sburl" placeholder="https://xxxx.supabase.co"></div>
      <div class="fg"><label>배포 URL (GitHub Pages)</label><input id="f-deploy" placeholder="https://xxx.github.io/yyy/"></div>
      <div class="fg"><label>Anon / Publishable Key <span style="color:var(--green)">🔐</span></label>
        <div class="sec-in">
          <input type="password" id="f-sbkey" autocomplete="off">
          <div class="tools"><button onclick="peek('f-sbkey')">보기</button><button onclick="cp('f-sbkey')">복사</button></div>
        </div>
      </div>
      <div class="fg"><label>Service Role Key <span style="color:var(--green)">🔐</span></label>
        <div class="sec-in">
          <input type="password" id="f-sbservice" autocomplete="off">
          <div class="tools"><button onclick="peek('f-sbservice')">보기</button><button onclick="cp('f-sbservice')">복사</button></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>계정 정보 🔐</h3>
      <div class="warnbox">이 영역의 값은 AES-GCM으로 암호화되어 저장됩니다. 서버에는 암호문만 전송됩니다.</div>

      <div class="r2">
        <div class="fg"><label>구글 ID</label><input id="f-gid" autocomplete="off"></div>
        <div class="fg"><label>구글 PW</label>
          <div class="sec-in"><input type="password" id="f-gpw" autocomplete="off">
            <div class="tools"><button onclick="peek('f-gpw')">보기</button><button onclick="cp('f-gpw')">복사</button></div></div>
        </div>
      </div>
      <div class="r2">
        <div class="fg"><label>GitHub ID</label><input id="f-hid" autocomplete="off"></div>
        <div class="fg"><label>GitHub PW</label>
          <div class="sec-in"><input type="password" id="f-hpw" autocomplete="off">
            <div class="tools"><button onclick="peek('f-hpw')">보기</button><button onclick="cp('f-hpw')">복사</button></div></div>
        </div>
      </div>
      <div class="r2">
        <div class="fg"><label>Supabase ID</label><input id="f-sid" autocomplete="off"></div>
        <div class="fg"><label>Supabase PW</label>
          <div class="sec-in"><input type="password" id="f-spw" autocomplete="off">
            <div class="tools"><button onclick="peek('f-spw')">보기</button><button onclick="cp('f-spw')">복사</button></div></div>
        </div>
      </div>
      <div class="fg"><label>기타 계정 · 비고 (도메인·호스팅·ntfy 토픽 등)</label>
        <textarea id="f-etc" rows="4" placeholder="예)&#10;ntfy 토픽: xxx_alert&#10;도메인: 가비아 / ID: xxx / PW: xxx"></textarea></div>
    </div>

    <div class="panel">
      <h3>메모</h3>
      <div class="fg"><textarea id="f-memo" rows="4"></textarea></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ===== Supabase (index.html과 동일 설정 공유) ===== */
const LS_SBURL='hk_sb_url', LS_SBKEY='hk_sb_key';
const SB_DEFAULT_URL='https://pllwltojbofjaftcemvn.supabase.co';
const SB_DEFAULT_KEY='sb_publishable_9dYJzdz472b888EcqdBBaA_Ncwk0yvT';
function getSbUrl(){return (localStorage.getItem(LS_SBURL)||SB_DEFAULT_URL).replace(/\/+$/,'')}
function getSbKey(){return localStorage.getItem(LS_SBKEY)||SB_DEFAULT_KEY}

async function sb(path,opt){
  const o=opt||{};
  const r=await fetch(getSbUrl()+'/rest/v1/'+path,{
    method:o.method||'GET',
    headers:Object.assign({
      'apikey':getSbKey(),'Authorization':'Bearer '+getSbKey(),
      'Content-Type':'application/json','Prefer':o.prefer||'return=representation'
    },o.headers||{}),
    body:o.body?JSON.stringify(o.body):undefined
  });
  if(!r.ok) throw new Error('DB '+r.status+': '+(await r.text()).slice(0,120));
  const t=await r.text();
  return t?JSON.parse(t):null;
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s){return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function g(id){return document.getElementById(id).value.trim()}
function sv(id,v){document.getElementById(id).value=v||''}

/* ===== 암호화 (AES-GCM + PBKDF2) =====
   저장 형식: base64( salt(16) | iv(12) | ciphertext )
   마스터 비밀번호는 메모리에만 존재하며 서버로 전송되지 않는다. */
const ITER=250000, CHECK_KEY='hk_vault_check', CHECK_TXT='HC_SMART_VAULT_OK';
let MPW=null;

function b64e(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function b64d(str){const s=atob(str);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}

async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encJSON(obj,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  const out=new Uint8Array(16+12+ct.byteLength);
  out.set(salt,0);out.set(iv,16);out.set(new Uint8Array(ct),28);
  return b64e(out);
}
async function decJSON(blob,pw){
  const raw=b64d(blob);
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const key=await deriveKey(pw,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ===== 잠금 해제 ===== */
let ROWS=[];
async function unlock(){
  const pw=document.getElementById('mpw').value;
  const w=document.getElementById('vwarn');
  if(pw.length<6){w.textContent='6자 이상 입력하세요';return}
  w.textContent='확인 중…';
  try{
    const chk=localStorage.getItem(CHECK_KEY);
    if(chk){
      let ok=false;
      try{ ok=(await decJSON(chk,pw))===CHECK_TXT; }catch(e){ ok=false; }
      if(!ok){ fail('비밀번호가 올바르지 않습니다'); return; }
    }else{
      /* 이 기기에 검증값이 없으면 기존 레코드로 검증 */
      const probe=await sb('hk_clients?select=sec&sec=neq.&limit=1');
      if(probe&&probe.length){
        let ok=false;
        try{ await decJSON(probe[0].sec,pw); ok=true; }catch(e){ ok=false; }
        if(!ok){ fail('비밀번호가 올바르지 않습니다'); return; }
      }
      localStorage.setItem(CHECK_KEY,await encJSON(CHECK_TXT,pw));
    }
    MPW=pw;
    document.getElementById('mpw').value='';
    w.textContent='';
    document.getElementById('vault').classList.add('off');
    await loadAll();
  }catch(e){ fail('서버 연결 실패: '+e.message); }
}
function fail(msg){
  const v=document.getElementById('vault');
  document.getElementById('vwarn').textContent=msg;
  v.classList.remove('shake');void v.offsetWidth;v.classList.add('shake');
  document.getElementById('mpw').value='';
  document.getElementById('mpw').focus();
}
function relock(){
  MPW=null;ROWS=[];
  document.getElementById('list').innerHTML='';
  backList();
  document.getElementById('vault').classList.remove('off');
  document.getElementById('mpw').focus();
}
document.getElementById('mpw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});

/* ===== 목록 ===== */
async function loadAll(){
  try{
    ROWS=await sb('hk_clients?select=*&order=company')||[];
  }catch(e){
    document.getElementById('list').innerHTML='<div class="empty">테이블이 없습니다 — hk_clients 생성 SQL을 먼저 실행하세요</div>';
    return;
  }
  renderList();
}
function renderList(){
  const q=(document.getElementById('sch').value||'').toLowerCase();
  const box=document.getElementById('list');
  const list=ROWS.filter(r=>{
    if(!q)return true;
    const hay=[r.company,r.sb_project,r.sb_org,r.industry,
      (r.contacts||[]).map(c=>c.name+' '+c.dept).join(' ')].join(' ').toLowerCase();
    return hay.indexOf(q)>=0;
  });
  if(!list.length){box.innerHTML='<div class="empty">등록된 업체가 없습니다</div>';return}
  box.innerHTML=list.map(r=>{
    const c=(r.contacts||[])[0];
    return `<div class="cc" onclick="openClient(${r.id})">
      <div class="t"><span class="nm">${esc(r.company)}</span>
        ${r.industry?`<span class="tg">${esc(r.industry)}</span>`:''}
        ${r.sb_project?`<span class="tg b">SB · ${esc(r.sb_project)}</span>`:''}
        ${r.sec?'<span class="tg g">🔐 계정</span>':''}</div>
      <div class="d">${c?esc(c.name)+(c.dept?' · '+esc(c.dept):'')+(c.tel?' · '+esc(c.tel):''):'담당자 미등록'}
        ${r.tel?' &nbsp;|&nbsp; '+esc(r.tel):''}</div>
    </div>`;
  }).join('');
}

/* ===== 편집 ===== */
let CUR=null, CTCS=[];
function backList(){
  document.getElementById('v-edit').classList.add('hide');
  document.getElementById('v-list').classList.remove('hide');
  window.scrollTo({top:0});
}
function showEdit(){
  document.getElementById('v-list').classList.add('hide');
  document.getElementById('v-edit').classList.remove('hide');
  window.scrollTo({top:0});
}
function newClient(){
  CUR=null;CTCS=[];
  ['company','bizno','addr','tel','email','industry','homepage','sborg','sbproject','sburl',
   'deploy','sbkey','sbservice','gid','gpw','hid','hpw','sid','spw','etc','memo']
    .forEach(k=>sv('f-'+k,''));
  renderContacts();
  document.getElementById('delbtn').classList.add('hide');
  showEdit();
}
async function openClient(id){
  const r=ROWS.find(x=>x.id===id);if(!r)return;
  CUR=r;
  sv('f-company',r.company);sv('f-bizno',r.biz_no);sv('f-addr',r.addr);sv('f-tel',r.tel);
  sv('f-email',r.email);sv('f-industry',r.industry);sv('f-homepage',r.homepage);
  sv('f-sborg',r.sb_org);sv('f-sbproject',r.sb_project);sv('f-sburl',r.sb_url);sv('f-deploy',r.deploy_url);
  sv('f-memo',r.memo);
  CTCS=(r.contacts||[]).slice();
  renderContacts();
  ['sbkey','sbservice','gid','gpw','hid','hpw','sid','spw','etc'].forEach(k=>sv('f-'+k,''));
  if(r.sec){
    try{
      const s=await decJSON(r.sec,MPW);
      sv('f-sbkey',s.sbkey);sv('f-sbservice',s.sbservice);
      sv('f-gid',s.gid);sv('f-gpw',s.gpw);
      sv('f-hid',s.hid);sv('f-hpw',s.hpw);
      sv('f-sid',s.sid);sv('f-spw',s.spw);
      sv('f-etc',s.etc);
    }catch(e){ toast('계정정보 복호화 실패 — 마스터 비밀번호가 다릅니다'); }
  }
  document.getElementById('delbtn').classList.remove('hide');
  showEdit();
}
function renderContacts(){
  const box=document.getElementById('ctcs');
  if(!CTCS.length){box.innerHTML='<div style="font-size:12.5px;color:var(--sub);margin-bottom:10px">담당자가 없습니다</div>';return}
  box.innerHTML=CTCS.map((c,i)=>`<div class="ctc">
    <button class="del" onclick="delContact(${i})">✕</button>
    <div class="r3">
      <div class="fg"><label>이름</label><input value="${esc(c.name)}" oninput="setCtc(${i},'name',this.value)"></div>
      <div class="fg"><label>부서</label><input value="${esc(c.dept)}" oninput="setCtc(${i},'dept',this.value)"></div>
      <div class="fg"><label>직책</label><input value="${esc(c.role)}" oninput="setCtc(${i},'role',this.value)"></div>
    </div>
    <div class="r2">
      <div class="fg"><label>연락처</label><input value="${esc(c.tel)}" oninput="setCtc(${i},'tel',this.value)"></div>
      <div class="fg" style="margin-bottom:0"><label>메일</label><input value="${esc(c.email)}" oninput="setCtc(${i},'email',this.value)"></div>
    </div>
  </div>`).join('');
}
function addContact(){CTCS.push({name:'',dept:'',role:'',tel:'',email:''});renderContacts()}
function delContact(i){CTCS.splice(i,1);renderContacts()}
function setCtc(i,k,v){CTCS[i][k]=v}

async function saveClient(){
  const company=g('f-company');
  if(!company){toast('회사명을 입력하세요');return}
  if(!MPW){toast('금고가 잠겨 있습니다');return}
  const secObj={
    sbkey:g('f-sbkey'),sbservice:g('f-sbservice'),
    gid:g('f-gid'),gpw:g('f-gpw'),
    hid:g('f-hid'),hpw:g('f-hpw'),
    sid:g('f-sid'),spw:g('f-spw'),
    etc:document.getElementById('f-etc').value
  };
  const hasSec=Object.values(secObj).some(v=>v&&v.length);
  const body={
    company,biz_no:g('f-bizno'),addr:g('f-addr'),tel:g('f-tel'),email:g('f-email'),
    industry:g('f-industry'),homepage:g('f-homepage'),
    sb_org:g('f-sborg'),sb_project:g('f-sbproject'),sb_url:g('f-sburl'),deploy_url:g('f-deploy'),
    contacts:CTCS.filter(c=>c.name||c.tel||c.email),
    memo:document.getElementById('f-memo').value,
    sec:hasSec?await encJSON(secObj,MPW):'',
    updated_at:new Date().toISOString()
  };
  try{
    if(CUR) await sb('hk_clients?id=eq.'+CUR.id,{method:'PATCH',body});
    else await sb('hk_clients',{method:'POST',body});
    toast('저장되었습니다');
    await loadAll();backList();
  }catch(e){toast('저장 실패: '+e.message)}
}
async function delClient(){
  if(!CUR)return;
  if(!confirm(CUR.company+' 정보를 삭제할까요?\n계정정보도 함께 삭제됩니다.'))return;
  try{
    await sb('hk_clients?id=eq.'+CUR.id,{method:'DELETE',prefer:'return=minimal'});
    toast('삭제되었습니다');
    await loadAll();backList();
  }catch(e){toast('삭제 실패: '+e.message)}
}

/* ===== 보기 · 복사 ===== */
function peek(id){
  const el=document.getElementById(id);
  el.type = el.type==='password' ? 'text' : 'password';
}
function cp(id){
  const v=document.getElementById(id).value;
  if(!v){toast('내용이 없습니다');return}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(()=>toast('복사되었습니다'),()=>fb(v));
  }else fb(v);
}
function fb(v){
  const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);
  t.select();try{document.execCommand('copy');toast('복사되었습니다')}catch(e){toast('복사 실패')}
  document.body.removeChild(t);
}

/* ===== 백업 (암호문 그대로 내보내기) ===== */
function exportBackup(){
  if(!ROWS.length){toast('내보낼 데이터가 없습니다');return}
  const blob=new Blob([JSON.stringify(ROWS,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='hc_clients_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);
  toast('백업 파일이 저장되었습니다 (계정정보는 암호문)');
}

document.getElementById('mpw').focus();
</script>
